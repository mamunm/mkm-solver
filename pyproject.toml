[project]
name = "mkm-solver"
version = "0.1.0"
description = "Microkinetic model solver for C-N coupling on metal surfaces"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "rich>=13.0",
    "matplotlib>=3.7",
    "cython>=3.2.4",
    "scikits-odes-core>=3.0",
    "scikits-odes-sundials>=3.0",
]

[project.scripts]
mkm-solver = "mkm_solver.__main__:main"
mkm-fit-lateral = "mkm_solver.fit_lateral:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
